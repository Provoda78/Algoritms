services:
  postgres:
    image: postgres:16-alpine
    container_name: dbms_task6_postgres
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: employees_db
    ports:
      # 5433 — чтобы не конфликтовать с локальным PostgreSQL, если он есть
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d employees_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
